[package]
name = "harvest-core"
version = "0.1.0"
edition = "2021"
description = "Decoupled backend logic for Harvest (no UI framework dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
reqwest = { version = "0.12", features = ["stream", "json"] }
zip = "2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
